# ============================================================================
# AiAll · Nginx 站点配置（Docker 单容器：nginx 与 php-fpm 同机）
# ----------------------------------------------------------------------------
# 站点根 = 项目根目录 /var/www/html（应用入口在 public/index.php，由 rewrite 转发）
# php-fpm 监听 127.0.0.1:9000
# ============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80 default_server;
        server_name _;

        root  /var/www/html;
        index index.php index.html;

        # 长上下文对话请求体可能较大
        client_max_body_size 50m;

        charset utf-8;
        charset_types text/css application/javascript text/javascript application/json image/svg+xml;

        # ---------------------------------------------------------------------
        # ① 安全：敏感路径与扩展名一律拒绝（防止 .env / 源码 / 日志暴露）
        # ---------------------------------------------------------------------
        location ~ ^/(storage|database|docs|tools|tests|app|config|bootstrap|routes|bin|vendor|node_modules|docker|\.workbuddy|\.git)(/|$) {
            return 404;
        }
        location ~* \.(env|sql|log|bak|md|ini|sh|bat|ps1|lock|yml|yaml|htaccess|conf)$ {
            return 404;
        }
        location ~ /\.(?!well-known) {
            return 404;
        }

        # ---------------------------------------------------------------------
        # ② 静态资源：URL /assets/** 实际位于 public/assets/**
        # ---------------------------------------------------------------------
        location ~* ^/assets/(.+\.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp))$ {
            alias /var/www/html/public/assets/$1;
            charset utf-8;
            charset_types text/css application/javascript text/javascript application/json image/svg+xml;
            add_header Cache-Control "no-cache, must-revalidate";
            access_log off;
        }

        # ---------------------------------------------------------------------
        # ③ SSE 流式接口：关闭缓冲，保证逐块下发
        # ---------------------------------------------------------------------
        location = /v1/chat/completions {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root/public/index.php;
            fastcgi_param  HTTP_X_FORWARDED_FOR $remote_addr;
            include        fastcgi_params;

            fastcgi_buffering off;
            fastcgi_keep_conn on;
            gzip off;

            fastcgi_read_timeout 360s;
            fastcgi_send_timeout 360s;
        }

        # ---------------------------------------------------------------------
        # ④ PHP 处理
        # ---------------------------------------------------------------------
        location ~ [^/]\.php(/|$) {
            try_files $uri =404;
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param  HTTP_X_FORWARDED_FOR $remote_addr;
            include        fastcgi_params;

            fastcgi_read_timeout 60s;
        }

        # ---------------------------------------------------------------------
        # ⑤ 入口与回退
        # ---------------------------------------------------------------------
        rewrite ^/$ /public/index.php last;

        location / {
            try_files $uri $uri/ /public/index.php?$query_string;
        }

        location ~* \.(html|htm)$ {
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
